<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<link rel="stylesheet" href="../style/style.css">
<script src="../js/validation.js"></script>
</head>

<body>

<div class="container">

<h2>Contact us</h2>

<form onsubmit="return collect_data()">
<table>

<tr>
<td>
<label for="firstName">FIRST NAME</label><br>
<input type="text" id="firstName" name="firstName"><br>
<span id="firstName_error"></span>
</td>

<td>
<label for="lastName">LAST NAME</label><br>
<input type="text" id="lastName" name="lastName"><br>
<span id="lastName_error"></span>
</td>
</tr>

<tr>
<td>
<label for="email">EMAIL</label><br>
<input type="email" id="email" name="email"><br>
<span id="email_error"></span>
</td>

<td>
<label for="phnNum">PHONE NUMBER</label><br>
<input type="tel" id="phnNum" name="phnNum"><br>
<span id="phnNum_error"></span>
</td>
</tr>

<tr>
<td colspan="2">
<label for="message">WHAT DO YOU HAVE IN MIND</label><br>
<textarea id="message" name="message" placeholder="Please enter query..."></textarea><br>
<span id="message_error"></span>
</td>
</tr>

<tr>
<td colspan="2" class="button-row">
<button type="submit">Submit</button>
</td>
</tr>

</table>
</form>

</div>

</body>
</html>
