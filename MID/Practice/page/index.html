<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <div class = "container">
        <h2>Contact Us</h2>
        

        <table>
            <tr>
                <td>
                    <label for="firstNameLabel">FIRST NAME</label>
                    
                </td>

                <td>
                    <label for="lastNameLabel">LAST NAME</label> 
                    
                </td>
            </tr>
            <tr>
                <td>
                    <input type="text" name="firstName" id="firstNameId">
                </td>
                <td>
                    <input type="text" name="lastName" id="lastNameId">
                </td>
                
            </tr>
            <tr>
                <td>
                    <label for="emailLabel">EMAIL</label>
                    
                </td>

                <td>
                    <label for="phoneNumberLabel">PHONE NUMBER</label> 
                    
                </td>
            </tr>
            <tr>
                <td>
                    <input type="email" name="email" id="emailId">
                </td>
                <td>
                    <input type="tel" name="phoneNumber" id="phoneNumberId">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="commentLabel">WHAT DO YOU HAVE IN MIND</label>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="textarea" name="comment" id="commentId">
                </td>
            </tr>

            <tr>
                <td colspan="2" class="button-row">
                   <button type = 'submit'>Submit</button>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
